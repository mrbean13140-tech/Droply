# Сборка шаблона LXC на свежем Go (stable): при изменении кода и раз в месяц — чтобы подтягивать исправления безопасности Go.
name: build
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 1 * *'
  push:
    branches: [main]
    paths: ['**.go', 'go.mod', 'web/**', 'build-rootfs.sh', 'etc-landrop.json', '.github/workflows/build.yml']
permissions:
  contents: write
concurrency: build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - run: go vet ./... && go test -v -run "TestGeoDB" ./... && go test ./...
        env:
          DROPLY_GEO_TEST: "1"
      - name: rootfs
        run: |
          sh build-rootfs.sh
          mv droply-rootfs.tar.gz dist/
          { go version | cut -d' ' -f3; sha256sum dist/droply-rootfs.tar.gz | cut -d' ' -f1; } > dist/BUILD_INFO
          cat dist/BUILD_INFO
      - name: commit
        run: |
          git config user.name droply-build
          git config user.email actions@users.noreply.github.com
          git add -f dist
          git diff --cached --quiet || { git commit -m "Сборка $(head -1 dist/BUILD_INFO) [skip ci]"; git pull --rebase -q; git push; }
